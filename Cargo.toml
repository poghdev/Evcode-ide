[package]
name = "evcode"
version = "0.2.0"
authors = ["Emil Poghosyan <poghoosyann@gmail.com>"]
edition = "2021"
description = "A high-performance terminal IDE with Ghost Snap for secure and fast coding sessions."
license = "MIT"
homepage = "https://products.eeive.com"
repository = "https://github.com/poghdev/Evcode-ide"
documentation = "https://github.com/poghdev/Evcode-ide#readme"
keywords = ["ide", "terminal", "tui", "rust", "editor"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "evcode"
path = "src/main.rs"

[dependencies]
ratatui        = "0.29"
crossterm      = "0.28"
tui-textarea   = { version = "0.7", features = ["crossterm", "search"] }
serde          = { version = "1", features = ["derive"] }
serde_json     = "1"
walkdir        = "2"
dirs           = "5"
anyhow         = "1"
tokio          = { version = "1", features = ["full"] }

[dependencies.arboard]
version = "3.4"
default-features = true
